name: Engine acceptance
on:
  push:
    branches: [codex/shaping-calibration]
  pull_request:
    paths: [app.py, calibration.py, tests/engine_acceptance.py, .github/workflows/engine-acceptance.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Scoring is merged into main. Exercise the checked-out PR directly;
      # remerging its old pre-squash feature commit can conflict with new fixes.
      - uses: actions/checkout@v4
        with:
          repository: kriziw/netem-traffic-simulator
          ref: d59d1cb86bbefc8b43c22acf75cea9f09ff52a9e
          path: _simulator
      - uses: actions/checkout@v4
        with:
          ref: 6ba3161237a7db6d7ec89d4797939276de7bcedf
          path: _legacy_platform
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          pip install -r _simulator/requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y iproute2 curl
      - name: Verify live-window controller and simulator contract
        run: SIMULATOR_SOURCE="$PWD/_simulator" python tests/live_window_acceptance.py
      - name: Verify actual old and new consumer compatibility
        run: SIMULATOR_SOURCE="$PWD/_simulator" python tests/engine_compatibility.py
      - name: Exercise real packets and application engines in isolated namespaces
        run: sudo env SIMULATOR_SOURCE="$PWD/_simulator" "$(command -v python)" tests/engine_acceptance.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-acceptance-evidence
          path: |
            live-window-acceptance-results.json
            engine-acceptance-results.json
            engine-compatibility-results.json
          if-no-files-found: warn
