name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install application dependency
        run: python -m pip install --disable-pip-version-check flask

      - name: Compile Python
        run: python -m py_compile app.py netem_core.py

      - name: Validate Flask routes and templates
        run: |
          python - <<'PY'
          from pathlib import Path
          from jinja2 import Environment, FileSystemLoader
          from app import app

          env = Environment(loader=FileSystemLoader("templates"))
          for path in Path("templates").glob("*.html"):
              env.get_template(path.name)

          endpoints = {rule.endpoint for rule in app.url_map.iter_rules()}
          required = {
              "index",
              "lab_tools",
              "updates",
              "setup",
              "api_state",
              "api_telemetry",
          }
          missing = required - endpoints
          if missing:
              raise SystemExit(f"Missing expected endpoints: {sorted(missing)}")

          print(f"Validated {len(endpoints)} Flask endpoints and all templates.")
          PY

      - name: Validate release configuration
        run: |
          python -m json.tool release-please-config.json >/dev/null
          python -m json.tool .release-please-manifest.json >/dev/null
          test -s version.txt
