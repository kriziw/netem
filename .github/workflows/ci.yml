name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install application dependency
        run: python -m pip install --disable-pip-version-check flask

      - name: Compile Python
        run: python -m py_compile app.py netem_core.py

      - name: Validate Flask routes and templates
        run: |
          python - <<'PY'
          from pathlib import Path
          from jinja2 import Environment, FileSystemLoader
          from app import app

          env = Environment(loader=FileSystemLoader("templates"))
          for path in Path("templates").rglob("*.html"):
              env.get_template(path.relative_to("templates").as_posix())

          endpoints = {rule.endpoint for rule in app.url_map.iter_rules()}
          required = {
              "overview",
              "index",
              "wan_links",
              "tests",
              "sessions",
              "session_start",
              "session_stop",
              "quick_wan_action",
              "scenarios",
              "traffic_security",
              "analytics",
              "integrations",
              "settings",
              "lab_tools",
              "updates",
              "setup",
              "api_state",
              "api_telemetry",
              "api_events",
              "api_history",
              "api_probes",
              "probe_save",
              "probe_delete",
              "probe_run",
              "session_report",
              "session_report_json",
              "documentation",
              "documentation_page",
          }
          missing = required - endpoints
          if missing:
              raise SystemExit(f"Missing expected endpoints: {sorted(missing)}")

          print(f"Validated {len(endpoints)} Flask endpoints and all templates.")
          PY

      - name: Smoke-test redesigned GET pages
        run: |
          python - <<'PY'
          import json
          from app import app, CONFIG_PATH

          CONFIG_PATH.write_text(json.dumps({
              "mgmt_interface": "lo",
              "restore_bridges_on_startup": False,
              "restore_shaping_on_startup": False,
              "wan_links": [{
                  "id": "wan1",
                  "name": "CI WAN",
                  "bridge": "lo",
                  "inner": "lo",
                  "outer": "lo",
                  "preset": "dia",
                  "quality": 100,
                  "mode": "quality"
              }]
          }))

          try:
              client = app.test_client()
              pages = [
                  "/",
                  "/dashboard",
                  "/wan",
                  "/tests",
                  "/sessions",
                  "/scenarios",
                  "/traffic-security",
                  "/analytics",
                  "/integrations",
                  "/settings",
                  "/setup",
                  "/presets",
                  "/updates",
                  "/lab",
                  "/docs",
                  "/docs/getting-started",
                  "/docs/architecture",
                  "/docs/overview",
                  "/docs/tests",
                  "/docs/sessions",
                  "/docs/wan-links",
                  "/docs/scenarios",
                  "/docs/traffic-security",
                  "/docs/analytics-sla",
                  "/docs/integrations-api",
                  "/docs/topology-profiles",
                  "/docs/updates-releases",
                  "/docs/troubleshooting",
                  "/docs/roadmap",
                  "/docs/reference",
              ]
              for path in pages:
                  response = client.get(path, follow_redirects=True)
                  if response.status_code != 200:
                      raise SystemExit(f"{path} returned HTTP {response.status_code}")
                  print(f"PASS {path}")

              response = client.post(
                  "/sessions/start",
                  data={"name": "CI validation session", "return_to": "sessions"},
                  follow_redirects=True,
              )
              if response.status_code != 200:
                  raise SystemExit("Session start failed")
              state = client.get("/api/v1/state").get_json()
              if not state.get("session", {}).get("active"):
                  raise SystemExit("Session did not become active")

              response = client.post(
                  "/sessions/stop",
                  data={"return_to": "sessions"},
                  follow_redirects=True,
              )
              if response.status_code != 200:
                  raise SystemExit("Session stop failed")
              state = client.get("/api/v1/state").get_json()
              if state.get("session", {}).get("active"):
                  raise SystemExit("Session remained active after stop")
              print("PASS session lifecycle")

              from app import (
                  LAB_SESSIONS,
                  init_telemetry_db,
                  telemetry_connect,
                  validate_probe_definition,
                  validate_scenario_steps,
              )

              session_id = LAB_SESSIONS[-1]["id"]
              response = client.get(f"/sessions/{session_id}/report")
              if response.status_code != 200:
                  raise SystemExit("Session report failed")
              response = client.get(f"/sessions/{session_id}/report.json")
              if response.status_code != 200:
                  raise SystemExit("Session report JSON failed")
              print("PASS session reports")

              steps = validate_scenario_steps([
                  {
                      "after": 0,
                      "action": "assert",
                      "condition": {"type": "sla", "state": "pass"},
                      "timeout": 5,
                  },
                  {
                      "after": 0,
                      "action": "wait",
                      "condition": {
                          "type": "traffic",
                          "field": "down_mbps",
                          "op": ">=",
                          "value": 1,
                      },
                      "timeout": 5,
                  },
              ])
              if len(steps) != 2:
                  raise SystemExit("Conditional scenario validation failed")
              print("PASS conditional scenarios")

              probe = validate_probe_definition(
                  {
                      "name": "CI ICMP",
                      "link_id": "wan1",
                      "kind": "icmp",
                      "target": "127.0.0.1",
                      "source_side": "auto",
                      "interval_s": 5,
                      "timeout_s": 1,
                      "enabled": True,
                  },
                  json.loads(CONFIG_PATH.read_text()),
              )
              if probe["kind"] != "icmp":
                  raise SystemExit("Probe validation failed")
              print("PASS active probe validation")

              init_telemetry_db()
              with telemetry_connect() as conn:
                  tables = {
                      row[0]
                      for row in conn.execute(
                          "SELECT name FROM sqlite_master WHERE type='table'"
                      ).fetchall()
                  }
              if not {"telemetry_samples", "probe_samples"} <= tables:
                  raise SystemExit("Telemetry schema missing")
              print("PASS persistent telemetry schema")
          finally:
              if CONFIG_PATH.exists():
                  CONFIG_PATH.unlink()
              from app import SESSIONS_PATH, TELEMETRY_DB_PATH
              if SESSIONS_PATH.exists():
                  SESSIONS_PATH.unlink()
              for path in (
                  TELEMETRY_DB_PATH,
                  TELEMETRY_DB_PATH.with_name(TELEMETRY_DB_PATH.name + "-wal"),
                  TELEMETRY_DB_PATH.with_name(TELEMETRY_DB_PATH.name + "-shm"),
              ):
                  if path.exists():
                      path.unlink()
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate telemetry and Traffic Simulator regressions
        run: |
          python -m unittest discover -s tests -v
          node --test tests/telemetry.test.js

      - name: Validate release configuration
        run: |
          python -m json.tool release-please-config.json >/dev/null
          python -m json.tool .release-please-manifest.json >/dev/null
          test -s version.txt
