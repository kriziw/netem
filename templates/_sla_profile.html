<form method="post" action="{{ url_for('lab_sla') }}">
  <input type="hidden" name="return_to" value="{{ sla_return_to|default('analytics') }}">
  {% if sla_return_to == 'settings' %}<input type="hidden" name="return_section" value="profiles">{% endif %}
  <label for="sla-name">Profile name</label>
  <input id="sla-name" type="text" name="name" value="{{ sla_profile.name }}">
  <div class="form-grid-3">
    <div><label for="sla-latency">Max latency · ms</label><input id="sla-latency" type="number" min="0" step="0.1" name="latency_ms" value="{{ sla_profile.latency_ms }}"></div>
    <div><label for="sla-jitter">Max jitter · ms</label><input id="sla-jitter" type="number" min="0" step="0.1" name="jitter_ms" value="{{ sla_profile.jitter_ms }}"></div>
    <div><label for="sla-loss">Max loss · %</label><input id="sla-loss" type="number" min="0" max="100" step="0.1" name="loss_pct" value="{{ sla_profile.loss_pct }}"></div>
  </div>
  <div class="actions"><button class="btn btn-primary" type="submit">Save SLA profile</button></div>
</form>
